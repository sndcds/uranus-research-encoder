[project]
name = "uranus-research-encoder"
version = "0.2.0"
description = "Offline internal Jina embedding and contextual chunking service"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "transformers==5.17.0",
]

[dependency-groups]
runtime-torch = ["torch==2.11.0", "peft>=0.17,<1"]
runtime-onnx = ["onnxruntime==1.30.0"]
export = ["torch==2.11.0", "peft==0.21.1", "onnx==1.23.1", "onnxscript==0.6.2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", {include-group = "export"}]

[tool.uv]
default-groups = ["dev", "runtime-torch", "runtime-onnx"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not benchmark'"
markers = [
  "integration: explicitly opted-in tests of locally cached Jina weights",
  "benchmark: explicitly invoked CPU measurements, never normal CI",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
